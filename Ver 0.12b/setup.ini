[Output]
; 提取出来的资源存到哪个目录。
;
;   相对路径 —— 从程序所在目录算起，例如：
;       path = Extract Resources
;   绝对路径 —— 直接写完整路径（换盘、放到别处用这个），例如：
;       path = D:\拆包输出
;
; 命令行 -o 参数会覆盖这里的设置。
path = Extract Resources
